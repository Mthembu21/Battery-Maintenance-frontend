services:
  - type: web
    name: battery-maintenance-frontend
    env: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist

    routes:
      # Handle SPA routing - redirect all routes to index.html
      - type: rewrite
        source: /.*
        destination: /index.html
      # Static assets should be served directly
      - type: file
        source: /assets/*
        destination: /assets/

    envVars:
      - key: VITE_API_URL
        value: https://battery-maintenance-backend.onrender.com/api

    autoDeploy: true