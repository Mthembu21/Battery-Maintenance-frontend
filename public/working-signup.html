<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battery Maintenance - Technician Sign Up</title>
    <meta name="description" content="Create your technician account for Battery Maintenance System">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            color: #1e293b;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .logo p {
            color: #64748b;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 500;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .alert-success {
            background: #10b981;
            color: white;
        }
        
        .alert-error {
            background: #ef4444;
            color: white;
        }
        
        .hidden {
            display: none;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }
        
        .footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
        
        .account-info {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            margin-top: 20px;
            font-size: 13px;
        }
        
        .account-info h4 {
            color: #1e293b;
            margin-bottom: 8px;
        }
        
        .account-info p {
            color: #64748b;
            margin: 4px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🔋 Battery Maintenance</h1>
            <p>Technician Sign Up</p>
        </div>
        
        <div id="successAlert" class="alert alert-success hidden"></div>
        <div id="errorAlert" class="alert alert-error hidden"></div>
        
        <form id="signupForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    required 
                    placeholder="technician@company.com"
                    autocomplete="email"
                >
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    required 
                    minlength="6"
                    placeholder="••••••••"
                    autocomplete="new-password"
                >
            </div>
            
            <div class="form-group">
                <label for="technicianName">Full Name</label>
                <input 
                    type="text" 
                    id="technicianName" 
                    name="technicianName" 
                    required 
                    placeholder="John Smith"
                    autocomplete="name"
                >
            </div>
            
            <div class="form-group">
                <label for="employeeId">Employee ID</label>
                <input 
                    type="text" 
                    id="employeeId" 
                    name="employeeId" 
                    required 
                    placeholder="EMP001"
                    autocomplete="off"
                >
            </div>
            
            <button type="submit" id="submitBtn" class="btn">
                Create Account
            </button>
        </form>
        
        <div id="accountInfo" class="account-info hidden">
            <h4>✅ Account Created Successfully!</h4>
            <p><strong>Name:</strong> <span id="displayName"></span></p>
            <p><strong>ID:</strong> <span id="displayId"></span></p>
            <p><strong>Email:</strong> <span id="displayEmail"></span></p>
            <p><strong>Role:</strong> Technician</p>
            <p><strong>Created:</strong> <span id="displayDate"></span></p>
            <p><strong>Token:</strong> <span id="displayToken"></span></p>
            <p style="margin-top: 12px; color: #059669;">
                ✅ Account stored in browser. You can now access the maintenance system.
            </p>
        </div>
        
        <div class="footer">
            <p>Already have an account? <a href="#" onclick="showLoginInfo()">Sign In</a></p>
        </div>
    </div>

    <script>
        // Form submission handler
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const successAlert = document.getElementById('successAlert');
            const errorAlert = document.getElementById('errorAlert');
            const accountInfo = document.getElementById('accountInfo');
            
            // Hide alerts
            successAlert.classList.add('hidden');
            errorAlert.classList.add('hidden');
            accountInfo.classList.add('hidden');
            
            // Disable button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating Account...';
            
            try {
                // Get form data
                const formData = new FormData(e.target);
                const email = formData.get('email').toLowerCase().trim();
                const password = formData.get('password');
                const technicianName = formData.get('technicianName').trim();
                const employeeId = formData.get('employeeId').trim();
                
                console.log('Creating technician account:', { 
                    email, 
                    password: '***', 
                    technicianName, 
                    employeeId 
                });
                
                // Create user account locally
                const user = {
                    id: 'user_' + Date.now(),
                    email: email,
                    technicianName: technicianName,
                    employeeId: employeeId,
                    role: 'Technician',
                    createdAt: new Date().toISOString(),
                    isActive: true
                };
                
                // Generate simple token
                const token = btoa(`${user.email}:${user.id}:${Date.now()}`);
                
                // Store in localStorage
                localStorage.setItem('battery_maintenance_token', token);
                localStorage.setItem('battery_maintenance_user', JSON.stringify(user));
                
                // Display success
                document.getElementById('displayName').textContent = user.technicianName;
                document.getElementById('displayId').textContent = user.employeeId;
                document.getElementById('displayEmail').textContent = user.email;
                document.getElementById('displayDate').textContent = new Date().toLocaleString();
                document.getElementById('displayToken').textContent = token.substring(0, 30) + '...';
                
                successAlert.textContent = '✅ Technician account created successfully!';
                successAlert.classList.remove('hidden');
                
                accountInfo.classList.remove('hidden');
                
                // Reset form
                e.target.reset();
                
                // Update button
                submitBtn.textContent = 'Create Another Account';
                submitBtn.disabled = false;
                
                console.log('✅ Account created successfully:', user);
                
            } catch (error) {
                console.error('❌ Account creation failed:', error);
                errorAlert.textContent = '❌ Failed to create account: ' + error.message;
                errorAlert.classList.remove('hidden');
                submitBtn.textContent = 'Create Account';
                submitBtn.disabled = false;
            }
        });
        
        function showLoginInfo() {
            const user = localStorage.getItem('battery_maintenance_user');
            if (user) {
                const userData = JSON.parse(user);
                alert(`Welcome back, ${userData.technicianName}!\n\nYou are already logged in as:\n• Employee ID: ${userData.employeeId}\n• Email: ${userData.email}\n• Role: ${userData.role}\n\nYour account is ready to use.`);
            } else {
                alert('No account found. Please create an account first.');
            }
        }
        
        // Check for existing account on load
        window.addEventListener('load', () => {
            const token = localStorage.getItem('battery_maintenance_token');
            const user = localStorage.getItem('battery_maintenance_user');
            
            if (token && user) {
                const userData = JSON.parse(user);
                const successAlert = document.getElementById('successAlert');
                const accountInfo = document.getElementById('accountInfo');
                
                successAlert.textContent = `👋 Welcome back, ${userData.technicianName}!`;
                successAlert.classList.remove('hidden');
                
                document.getElementById('displayName').textContent = userData.technicianName;
                document.getElementById('displayId').textContent = userData.employeeId;
                document.getElementById('displayEmail').textContent = userData.email;
                document.getElementById('displayDate').textContent = new Date(userData.createdAt).toLocaleString();
                document.getElementById('displayToken').textContent = token.substring(0, 30) + '...';
                
                accountInfo.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
